name: Idea or improvement
description: Something that would make the demo or the product better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve, and for whom
      description: Describe the person and the moment, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
