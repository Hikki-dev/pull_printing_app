<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Printer panel release jobs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
body{margin:0;font-family:'Inter',system-ui,sans-serif}
a{text-decoration:none}
</style>
</helmet>
<div style="width:1024px;height:600px;box-sizing:border-box;background:#F4F6F8;color:#16212C;display:flex;flex-direction:column">

  <div style="height:64px;box-sizing:border-box;padding:0 32px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #D5DBE1">
    <div style="display:flex;align-items:baseline;gap:16px">
      <span style="font-size:20px;font-weight:700">Alice Tan</span>
      <span style="font-size:16px;color:#4A5866">38 pages left this month</span>
    </div>
    <a href="Kiosk-SignIn.dc.html" style="display:flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:10px;border:1px solid #16212C;color:#16212C;font-size:16px;font-weight:600">Sign out</a>
  </div>

  <div style="padding:20px 32px 8px;display:flex;align-items:baseline;justify-content:space-between">
    <h1 style="margin:0;font-size:28px;font-weight:700">Your documents</h1>
    <span style="font-size:16px;color:#4A5866">Untick any you do not want to print now</span>
  </div>

  <div style="flex-grow:1;padding:0 32px;display:flex;flex-direction:column;gap:8px;overflow:hidden">
    <label style="display:flex;align-items:center;gap:20px;min-height:64px;padding:0 20px;background:#fff;border:2px solid #0B5CAD;border-radius:12px">
      <input type="checkbox" checked style="width:28px;height:28px;accent-color:#0B5CAD;margin:0">
      <span style="flex-grow:1;font-size:20px;font-weight:600">Q3 budget review.pdf</span>
      <span style="font-size:18px;color:#4A5866">12 pages</span>
      <span style="width:110px;text-align:right;font-size:16px;color:#4A5866">Today 9:02</span>
    </label>
    <label style="display:flex;align-items:center;gap:20px;min-height:64px;padding:0 20px;background:#fff;border:2px solid #0B5CAD;border-radius:12px">
      <input type="checkbox" checked style="width:28px;height:28px;accent-color:#0B5CAD;margin:0">
      <span style="flex-grow:1;font-size:20px;font-weight:600">Site visit notes.docx</span>
      <span style="font-size:18px;color:#4A5866">3 pages</span>
      <span style="width:110px;text-align:right;font-size:16px;color:#4A5866">Today 8:47</span>
    </label>
    <label style="display:flex;align-items:center;gap:20px;min-height:64px;padding:0 20px;background:#fff;border:2px solid #D5DBE1;border-radius:12px">
      <input type="checkbox" style="width:28px;height:28px;accent-color:#0B5CAD;margin:0">
      <span style="flex-grow:1;font-size:20px;font-weight:600">Contract draft v4.pdf</span>
      <span style="font-size:18px;color:#4A5866">28 pages</span>
      <span style="width:110px;text-align:right;font-size:16px;color:#4A5866">Yesterday</span>
    </label>
    <label style="display:flex;align-items:center;gap:20px;min-height:64px;padding:0 20px;background:#fff;border:2px solid #D5DBE1;border-radius:12px">
      <input type="checkbox" style="width:28px;height:28px;accent-color:#0B5CAD;margin:0">
      <span style="flex-grow:1;font-size:20px;font-weight:600">Floor plan.png</span>
      <span style="font-size:18px;color:#4A5866">1 page</span>
      <span style="width:110px;text-align:right;font-size:16px;color:#4A5866">Yesterday</span>
    </label>
  </div>

  <div style="height:104px;box-sizing:border-box;padding:0 32px;display:flex;align-items:center;gap:24px;background:#fff;border-top:1px solid #D5DBE1">
    <div style="flex-grow:1">
      <div style="font-size:20px;font-weight:700">2 documents · 15 pages</div>
      <div style="font-size:16px;color:#4A5866;margin-top:2px">23 pages left after printing</div>
    </div>
    <a href="Kiosk-Done.dc.html" style="display:flex;align-items:center;justify-content:center;height:72px;width:300px;border-radius:12px;background:#0B5CAD;color:#fff;font-size:24px;font-weight:700">Print</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
