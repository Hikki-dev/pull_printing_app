<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Printer panel printing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
body{margin:0;font-family:'Inter',system-ui,sans-serif}
a{text-decoration:none}
.pp-btn{transition:transform .12s ease,box-shadow .12s ease}
.pp-btn:active{transform:scale(.98)}
@keyframes pp-feed{0%{transform:translateY(-46px)}55%{transform:translateY(0)}100%{transform:translateY(0)}}
.pp-sheet{animation:pp-feed 2.4s ease-in-out infinite}
@keyframes pp-pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.pp-pop{animation:pp-pop .5s ease both}
@keyframes pp-count{from{width:100%}to{width:0}}
.pp-count{animation:pp-count 20s linear both}
@media (prefers-reduced-motion:reduce){.pp-sheet,.pp-pop,.pp-count{animation:none}}
</style>
</helmet>
<div style="width:1024px;height:600px;box-sizing:border-box;background:#0E2A47;color:#fff;display:flex;position:relative;overflow:hidden">
  <div style="position:absolute;left:-120px;top:-120px;width:420px;height:420px;border-radius:210px;background:#143A62"></div>
  <div style="position:absolute;right:-80px;bottom:-140px;width:400px;height:400px;border-radius:200px;background:#123256"></div>

  <div style="position:relative;flex:1 1 0;display:flex;flex-direction:column;justify-content:center;padding:0 56px;gap:18px">
    <div class="pp-pop" style="width:80px;height:80px;border-radius:40px;background:#2E9E6B;display:flex;align-items:center;justify-content:center">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h1 style="margin:0;font-size:48px;line-height:1.08;font-weight:800;letter-spacing:-0.02em">Printing 15 pages</h1>
    <p style="margin:0;font-size:22px;line-height:1.4;color:#B9CCE0">Collect your documents from the tray.<br>You have 23 pages left this month.</p>
    <div style="display:flex;gap:16px;margin-top:12px">
      <a class="pp-btn" href="Kiosk-Jobs.dc.html" style="display:flex;align-items:center;justify-content:center;height:64px;padding:0 32px;border-radius:14px;background:#183B63;border:1px solid #3A5F8A;color:#fff;font-size:20px;font-weight:600">Print more</a>
      <a class="pp-btn" href="Kiosk-SignIn.dc.html" style="display:flex;align-items:center;justify-content:center;height:64px;padding:0 36px;border-radius:14px;background:#fff;color:#0E2A47;font-size:20px;font-weight:700">Sign out</a>
    </div>
    <div style="margin-top:8px;max-width:360px">
      <div style="font-size:15px;color:#B9CCE0;margin-bottom:8px">Signing out automatically</div>
      <div style="height:6px;border-radius:3px;background:#2A5282;overflow:hidden"><div class="pp-count" style="height:100%;background:#6CB4F5"></div></div>
    </div>
  </div>

  <div style="position:relative;width:440px;flex:none;display:flex;align-items:center;justify-content:center">
    <svg width="400" height="288" viewBox="0 0 320 230" role="img" aria-label="Printer feeding out a sheet">
      <defs><clipPath id="slot"><rect x="0" y="134" width="320" height="100"/></clipPath></defs>
      <ellipse cx="160" cy="216" rx="132" ry="9" fill="#000" opacity=".22"/>
      <rect x="92" y="16" width="136" height="72" rx="4" fill="#DCE6F1" transform="rotate(-4 160 52)"/>
      <rect x="100" y="8" width="120" height="76" rx="4" fill="#fff"/>
      <rect x="112" y="22" width="60" height="6" rx="3" fill="#B9C8D8"/><rect x="112" y="36" width="96" height="4" rx="2" fill="#DCE6F1"/><rect x="112" y="46" width="88" height="4" rx="2" fill="#DCE6F1"/>
      <rect x="30" y="66" width="260" height="124" rx="16" fill="#1F4B7A"/>
      <path d="M30 82a16 16 0 0 1 16-16h228a16 16 0 0 1 16 16v20H30z" fill="#2B5F96"/>
      <rect x="52" y="104" width="76" height="16" rx="3" fill="#CFE3F7"/>
      <circle cx="240" cy="112" r="4.5" fill="#7FD1FF"/><circle cx="256" cy="112" r="4.5" fill="#fff" opacity=".45"/>
      <rect x="62" y="128" width="196" height="10" rx="5" fill="#0A1E33"/>
      <g clip-path="url(#slot)"><g class="pp-sheet"><rect x="80" y="134" width="160" height="78" rx="3" fill="#fff"/><rect x="94" y="150" width="70" height="6" rx="3" fill="#B9C8D8"/><rect x="94" y="164" width="130" height="4" rx="2" fill="#DCE6F1"/><rect x="94" y="174" width="116" height="4" rx="2" fill="#DCE6F1"/><rect x="94" y="184" width="124" height="4" rx="2" fill="#DCE6F1"/></g></g>
      <rect x="50" y="188" width="34" height="12" rx="3" fill="#0A1E33"/><rect x="236" y="188" width="34" height="12" rx="3" fill="#0A1E33"/>
    </svg>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
