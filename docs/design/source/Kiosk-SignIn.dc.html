<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Printer panel sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
body{margin:0;font-family:'Inter',system-ui,sans-serif}
a{text-decoration:none}
.pp-btn{transition:transform .12s ease,box-shadow .12s ease}
.pp-btn:hover{box-shadow:0 4px 14px rgba(14,42,71,.22)}
.pp-btn:active{transform:scale(.98)}
@keyframes pp-feed{0%{transform:translateY(-46px)}55%{transform:translateY(0)}100%{transform:translateY(0)}}
.pp-sheet{animation:pp-feed 3.2s ease-in-out infinite}
@keyframes pp-pulse{0%,100%{box-shadow:0 0 0 0 rgba(11,92,173,.25)}50%{box-shadow:0 0 0 8px rgba(11,92,173,0)}}
.pp-pulse{animation:pp-pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.pp-sheet,.pp-pulse{animation:none}}
</style>
</helmet>
<div style="width:1024px;height:600px;box-sizing:border-box;display:flex;color:#16212C;overflow:hidden">

  <div style="width:440px;flex:none;background:#0E2A47;color:#fff;position:relative;display:flex;flex-direction:column;padding:32px 40px 0;overflow:hidden">
    <div style="position:absolute;left:-90px;bottom:-110px;width:360px;height:360px;border-radius:180px;background:#143A62"></div>
    <div style="position:relative;display:flex;align-items:center;gap:12px">
      <svg width="44" height="44" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="9" fill="#0B5CAD"/><path d="M11 8h10l5 5v14a1 1 0 0 1-1 1H11a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" fill="#fff"/><path d="M21 8v5h5" fill="#B9D6F2"/><rect x="13" y="17" width="10" height="1.8" rx=".9" fill="#0B5CAD"/><rect x="13" y="21" width="10" height="1.8" rx=".9" fill="#0B5CAD"/><rect x="13" y="25" width="6" height="1.8" rx=".9" fill="#0B5CAD"/></svg>
      <span style="font-size:24px;font-weight:700">Pull Print</span>
    </div>
    <h1 style="position:relative;margin:48px 0 12px;font-size:40px;line-height:1.1;font-weight:800;letter-spacing:-0.02em">Sign in to collect your prints</h1>
    <p style="position:relative;margin:0;font-size:18px;line-height:1.45;color:#B9CCE0">You will only see your own documents.</p>
    <div style="position:relative;flex-grow:1;display:flex;align-items:flex-end;justify-content:center">
      <svg width="300" height="216" viewBox="0 0 320 230" role="img" aria-label="Printer with a sheet coming out" style="margin-bottom:-6px">
        <defs><clipPath id="slot"><rect x="0" y="134" width="320" height="100"/></clipPath></defs>
        <ellipse cx="160" cy="216" rx="132" ry="9" fill="#000" opacity=".22"/>
        <rect x="100" y="8" width="120" height="76" rx="4" fill="#fff"/>
        <rect x="112" y="22" width="60" height="6" rx="3" fill="#B9C8D8"/><rect x="112" y="36" width="96" height="4" rx="2" fill="#DCE6F1"/><rect x="112" y="46" width="88" height="4" rx="2" fill="#DCE6F1"/>
        <rect x="30" y="66" width="260" height="124" rx="16" fill="#1F4B7A"/>
        <path d="M30 82a16 16 0 0 1 16-16h228a16 16 0 0 1 16 16v20H30z" fill="#2B5F96"/>
        <rect x="52" y="104" width="76" height="16" rx="3" fill="#CFE3F7"/>
        <circle cx="240" cy="112" r="4.5" fill="#7FD1FF"/><circle cx="256" cy="112" r="4.5" fill="#fff" opacity=".45"/>
        <rect x="62" y="128" width="196" height="10" rx="5" fill="#0A1E33"/>
        <g clip-path="url(#slot)"><g class="pp-sheet"><rect x="80" y="134" width="160" height="78" rx="3" fill="#fff"/><rect x="94" y="150" width="70" height="6" rx="3" fill="#B9C8D8"/><rect x="94" y="164" width="130" height="4" rx="2" fill="#DCE6F1"/><rect x="94" y="174" width="116" height="4" rx="2" fill="#DCE6F1"/><rect x="94" y="184" width="124" height="4" rx="2" fill="#DCE6F1"/></g></g>
        <rect x="50" y="188" width="34" height="12" rx="3" fill="#0A1E33"/><rect x="236" y="188" width="34" height="12" rx="3" fill="#0A1E33"/>
      </svg>
    </div>
  </div>

  <div style="flex-grow:1;background:#F4F6F8;display:flex;flex-direction:column;padding:28px 48px 32px">
    <div style="display:flex;justify-content:flex-end;align-items:center;gap:10px;font-size:16px">
      <span style="font-weight:700">Level 3 East</span>
      <span style="display:inline-flex;align-items:center;gap:6px;color:#16212C;background:#fff;border:1px solid #D5DBE1;border-radius:20px;padding:4px 12px 4px 10px;font-size:14px;font-weight:600"><span style="width:8px;height:8px;border-radius:4px;background:#2E9E6B"></span>Ready</span>
    </div>

    <div style="flex-grow:1;display:flex;flex-direction:column;justify-content:center;gap:16px">
      <div class="pp-pulse" style="background:#fff;border:2px solid #0B5CAD;border-radius:20px;padding:26px 28px 24px;display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700">
          <svg width="26" height="26" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#F25022"/><rect x="11" y="1" width="9" height="9" fill="#7FBA00"/><rect x="1" y="11" width="9" height="9" fill="#00A4EF"/><rect x="11" y="11" width="9" height="9" fill="#FFB900"/></svg>
          Sign in with your phone
        </div>
        <div style="font-size:17px;line-height:1.5">On your phone, open <b>microsoft.com/devicelogin</b> and enter this code</div>
        <div style="font-size:52px;font-weight:800;letter-spacing:0.12em;font-variant-numeric:tabular-nums;text-align:center;padding:14px 0;background:#EAF1F9;color:#0E2A47;border-radius:14px">K7QH 4M2B</div>
        <a class="pp-btn" href="Kiosk-Jobs.dc.html" style="display:flex;align-items:center;justify-content:center;height:64px;border-radius:14px;background:#0B5CAD;color:#fff;font-size:20px;font-weight:700">I have entered the code</a>
      </div>
      <div style="display:flex;align-items:center;gap:16px;background:#fff;border:1px solid #D5DBE1;border-radius:16px;padding:0 24px;height:72px;color:#4A5866;font-size:18px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="9" cy="12" r="2"/><path d="M14 11h4M14 14h3"/></svg>
        <span style="flex-grow:1">Tap your staff card</span>
        <span style="font-size:14px;font-weight:600;border:1px solid #D5DBE1;border-radius:6px;padding:4px 10px">Coming later</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":600}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
